name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: look_vibe_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d look_vibe_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: look_vibe_test
      DB_SSL: "false"
      JWT_SECRET: ci-test-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: look-vibe/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: look-vibe

      - name: Run tests
        run: npm test -- --no-file-parallelism
        working-directory: look-vibe

      - name: Build application
        run: npm run build
        working-directory: look-vibe
